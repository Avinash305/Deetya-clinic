vasive surgical procedures.",gradient:"from-purple-500 to-purple-700"},{icon:i.jsx(zs,{className:"w-6 h-6"}),title:"Family Wellness",description:"Comprehensive health packages designed for individuals and families of all ages.",gradient:"from-teal-500 to-teal-700"}],Ql=[{icon:i.jsx(D2,{}),title:"General Medicine",slug:"general-medicine",desc:"Comprehensive primary care and preventive health management.",longDesc:`Our General Medicine department serves as the foundation of healthcare at DEETYA Clinic. We provide comprehensive primary care services encompassing preventive health checkups, acute illness management, chronic disease monitoring, and health risk assessments. Our experienced physicians are trained to diagnose and treat a wide spectrum of medical conditions, from common colds and infections to complex multi-system disorders.

We emphasize a holistic approach to healthcare, focusing on early detection, lifestyle modifications, and patient education. Every patient receives a personalized care plan tailored to their unique health needs, medical history, and risk factors. Our state-of-the-art diagnostic facilities enable accurate and timely diagnosis, ensuring the most effective treatment outcomes.`,highlights:["Annual health checkup packages","Chronic disease management (diabetes, hypertension, thyroid)","Acute illness treatment & infection management","Vaccination & immunization programs","Lifestyle & dietary counseling","Preventive health screenings"],detailImages:["https://images.pexels.com/photos/6129444/pexels-photo-6129444.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800","https://images.pexels.com/photos/7579826/pexels-photo-7579826.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800"],gradient:"from-blue-500 to-blue-700",image:"https://images.pexels.com/photos/20100299/pexels-photo-20100299.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=400&w=600"},{icon:i.jsx(G2,{}),title:"Neurology",slug:"neurology",desc:"Expert diagnosis and treatment for brain and nerve disorders.",longDesc:`The Neurology department at DEETYA Clinic offers comprehensive care for disorders affecting the brain, spinal cord, peripheral nerves, and muscles. Our team of highly skilled neurologists utilizes advanced diagnostic techniques including MRI, CT scans, EEG, EMG, and nerve conduction studies to accurately diagnose neurological conditions.

We treat a broad range of neurological disorders including stroke, epilepsy, multiple sclerosis, Parkinson disease, dementia, migraine disorders, and peripheral neuropathy. Our treatment approaches combine evidence-based medical therapies with lifestyle interventions and rehabilitation services. We also offer emergency neurological care for acute stroke and other neurological emergencies, with rapid assessment and treatment protocols to minimize long-term complications.`,highlights:["Stroke management & thrombolysis","Epilepsy evaluation & treatment","Headache & migraine management","Movement disorder treatment (Parkinson's)","Dementia & memory loss assessment","EMG, NCS & EEG diagnostics"],detailImages:["https://images.pexels.com/photos/7659869/pexels-photo-7659869.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800","https://images.pexels.com/photos/7089298/pexels-photo-7089298.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800"],gradient:"from-purple-500 to-purple-700",image:"https://images.pexels.com/photos/7089020/pexels-photo-7089020.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=400&w=600"},{icon:i.jsx(X2,{}),title:"Orthopedics",slug:"orthopedics",desc:"Advanced bone, joint, and musculoskeletal treatment.",longDesc:`Our Orthopedics department is dedicated to the diagnosis, treatment, and rehabilitation of musculoskeletal conditions. We provide comprehensive care for bone fractures, joint disorders, sports injuries, spine conditions, and arthritis, utilizing both surgical and non-surgical treatment approaches.

Our orthopedic surgeons are specialized in joint replacement surgeries (knee, hip, shoulder), arthroscopic procedures, spine surgeries, and trauma management. We also offer advanced treatments like platelet-rich plasma (PRP) therapy, stem cell therapy, and minimally invasive surgical techniques that ensure faster recovery and reduced post-operative pain. Our integrated rehabilitation program, including physiotherapy and occupational therapy, helps patients regain optimal function and return to their daily activities as quickly as possible.`,highlights:["Joint replacement surgery (knee, hip, shoulder)","Arthroscopic surgeries (ACL repair, meniscus)","Sports injury management & rehabilitation","Spine surgery & back pain treatment","Fracture care & trauma management","PRP therapy & regenerative medicine"],detailImages:["https://images.pexels.com/photos/5723885/pexels-photo-5723885.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800","https://images.pexels.com/photos/7089020/pexels-photo-7089020.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800"],gradient:"from-orange-500 to-orange-700",image:"https://images.pexels.com/photos/5723885/pexels-photo-5723885.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=400&w=600"},{icon:i.jsx(Q2,{}),title:"Pediatrics",slug:"pediatrics",desc:"Specialized care for infants, children, and adolescents.",longDesc:`The Pediatrics department at DEETYA Clinic provides comprehensive healthcare for children from birth through adolescence. Our pediatricians are dedicated to ensuring the healthy growth and development of every child through preventive care, early diagnosis, and evidence-based treatment.

We offer a complete range of pediatric services including well-baby checkups, childhood vaccination programs, growth and development monitoring, nutritional counseling, and management of acute and chronic childhood illnesses. Our child-friendly facility is designed to put young patients at ease, with a dedicated play area and a compassionate care approach. We also provide neonatal care for newborns and specialize in managing pediatric conditions such as asthma, allergies, infections, and developmental disorders.`,highlights:["Newborn & neonatal care","Childhood vaccination programs","Growth & development monitoring","Pediatric acute illness management","Nutritional counseling for children","Adolescent health services"],detailImages:["https://images.pexels.com/photos/8460032/pexels-photo-8460032.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800","https://images.pexels.com/photos/3662840/pexels-photo-3662840.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800"],gradient:"from-pink-500 to-pink-700",image:"https://images.pexels.com/photos/8460032/pexels-photo-8460032.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=400&w=600"},{icon:i.jsx(ju,{}),title:"Cardiology",slug:"cardiology",desc:"Heart health monitoring, diagnostics, and interventions.",longDesc:`The Cardiology department at DEETYA Clinic offers comprehensive cardiac care ranging from preventive cardiology to advanced interventional procedures. Our team of experienced cardiologists and cardiac surgeons is committed to providing the highest standard of care for patients with heart and vascular conditions.

We offer a full spectrum of diagnostic services including ECG, echocardiography, stress testing, 24-hour Holter monitoring, and cardiac catheterization. Our treatment services cover hypertension management, cholesterol disorders, heart failure treatment, coronary artery disease management, and cardiac rehabilitation. For patients requiring intervention, we provide advanced procedures such as angioplasty, stent placement, pacemaker implantation, and cardiac bypass surgery. Our cardiac emergency team is available 24/7 for heart attacks and other cardiac emergencies.`,highlights:["Advanced cardiac diagnostics (ECG, Echo, TMT)","Coronary angioplasty & stent placement","Pacemaker implantation","Heart failure management","Hypertension & cholesterol treatment","24/7 cardiac emergency care"],detailImages:["https://images.pexels.com/photos/9408868/pexels-photo-9408868.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800","https://images.pexels.com/photos/7659869/pexels-photo-7659869.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800"],gradient:"from-red-500 to-red-700",image:"https://images.pexels.com/photos/9408868/pexels-photo-9408868.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=400&w=600"},{icon:i.jsx(Y2,{}),title:"Ophthalmology",slug:"ophthalmology",desc:"Complete eye care from routine checkups to advanced surgeries.",longDesc:`Our Ophthalmology department provides comprehensive eye care services for patients of all ages, from routine vision screenings to advanced surgical procedures. Our ophthalmologists are equipped with state-of-the-art diagnostic and treatment technology to address a wide range of eye conditions.

We offer complete eye examination services including refraction, glaucoma screening, cataract evaluation, and retinal examinations. Our surgical services include cataract surgery with premium intraocular lens implants, LASIK and other refractive surgeries, glaucoma surgery, diabetic retinopathy treatment, and eyelid surgeries. We also provide pediatric ophthalmology services and emergency care for eye injuries and infections. Our goal is to preserve and enhance your vision with the most advanced and compassionate care possible.`,highlights:["Cataract surgery with premium IOL implants","LASIK & refractive surgery","Glaucoma diagnosis & management","Diabetic retinopathy treatment","Pediatric eye care","Contact lens fitting & vision therapy"],detailImages:["https://images.pexels.com/photos/32209715/pexels-photo-32209715.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800","https://images.pexels.com/photos/6129444/pexels-photo-6129444.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800"],gradient:"from-cyan-500 to-cyan-700",image:"https://images.pexels.com/photos/32209715/pexels-photo-32209715.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=400&w=600"},{icon:i.jsx(O2,{}),title:"Dental Care",slug:"dental-care",desc:"Full range of dental services including cosmetic dentistry.",longDesc:`The Dental Care department at DEETYA Clinic offers a complete range of dental services designed to maintain and enhance your oral health. Our team of experienced dentists and dental surgeons use modern techniques and equipment to provide pain-free, high-quality dental care.

We provide preventive dental services including routine cleanings, fluoride treatments, and dental sealants. Our restorative services include tooth-colored fillings, crowns, bridges, and dental implants for missing teeth replacement. For patients seeking aesthetic improvements, we offer teeth whitening, veneers, and smile makeovers. We also specialize in root canal treatments, gum disease management, and pediatric dentistry. Our dental facility is equipped with digital X-rays for accurate diagnosis with minimal radiation exposure.`,highlights:["Teeth cleaning & preventive care","Dental implants & tooth replacement","Root canal treatment","Teeth whitening & veneers","Orthodontic treatment (braces & aligners)","Pediatric dentistry"],detailImages:["https://images.pexels.com/photos/5622270/pexels-photo-5622270.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800","https://images.pexels.com/photos/7089298/pexels-photo-7089298.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800"],gradient:"from-teal-500 to-teal-700",image:"https://images.pexels.com/photos/5622270/pexels-photo-5622270.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=400&w=600"},{icon:i.jsx(B2,{}),title:"Pulmonology",slug:"pulmonology",desc:"Respiratory care and treatment for chronic lung conditions.",longDesc:`Our Pulmonology department specializes in the diagnosis and treatment of respiratory and lung disorders. Our pulmonologists are experts in managing both acute and chronic respiratory conditions, utilizing advanced diagnostic and therapeutic techniques to improve breathing and quality of life.

We treat a wide spectrum of pulmonary conditions including asthma, chronic obstructive pulmonary disease (COPD), pneumonia, tuberculosis, interstitial lung disease, and sleep-disordered breathing. Our diagnostic services include pulmonary function testing, bronchoscopy, chest imaging, and sleep studies. We offer comprehensive treatment plans including medication management, pulmonary rehabilitation, oxygen therapy, and non-invasive ventilation. Our department also runs specialized clinics for asthma, COPD, and smoking cessation.`,highlights:["Asthma diagnosis & management","COPD treatment & pulmonary rehabilitation","Sleep disorder & sleep apnea treatment","Bronchoscopy & lung diagnostics","Tuberculosis management","Smoking cessation programs"],detailImages:["https://images.pexels.com/photos/30425668/pexels-photo-30425668.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800","https://images.pexels.com/photos/7089298/pexels-photo-7089298.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800"],gradient:"from-sky-500 to-sky-700",image:"https://images.pexels.com/photos/30425668/pexels-photo-30425668.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=400&w=600"},{icon:i.jsx(J2,{}),title:"Dermatology",slug:"dermatology",desc:"Skin health, allergy management, and cosmetic procedures.",longDesc:`The Dermatology department at DEETYA Clinic provides comprehensive care for skin, hair, and nail conditions, as well as aesthetic and cosmetic services. Our dermatologists combine medical expertise with advanced technology to deliver effective treatments for a wide range of dermatological concerns.

We treat common skin conditions including acne, eczema, psoriasis, fungal infections, and skin allergies. Our surgical services include mole removal, skin cancer screening and treatment, and scar revision. For aesthetic concerns, we offer treatments such as chemical peels, microdermabrasion, laser hair removal, and anti-aging therapies including Botox and dermal fillers. We also specialize in hair loss evaluation and treatment, and provide comprehensive patch testing for allergic contact dermatitis.`,highlights:["Acne & acne scar treatment","Eczema, psoriasis & skin allergy care","Skin cancer screening & mole check","Laser hair removal & skin rejuvenation","Botox & dermal fillers","Hair loss diagnosis & treatment"],detailImages:["https://images.pexels.com/photos/7581588/pexels-photo-7581588.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800","https://images.pexels.com/photos/6129444/pexels-photo-6129444.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800"],gradient:"from-rose-500 to-rose-700",image:"https://images.pexels.com/photos/7581588/pexels-photo-7581588.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=400&w=600"},{icon:i.jsx(bu,{}),title:"ENT",slug:"ent",desc:"Ear, nose, and throat specialists for all ages.",longDesc:`Our ENT (Ear, Nose, and Throat) department provides comprehensive medical and surgical care for conditions affecting the head and neck region. Our ENT specialists are trained to diagnose and treat a wide range of disorders in both adults and children.

We offer specialized services for ear conditions including hearing loss evaluation, ear infections, tinnitus, and balance disorders. For nasal and sinus conditions, we provide treatment for sinusitis, nasal polyps, allergic rhinitis, and deviated nasal septum. Our throat services cover tonsillitis, voice disorders, swallowing difficulties, and sleep apnea. Surgical services include endoscopic sinus surgery, tonsillectomy, septoplasty, and thyroid surgery. We also have a dedicated audiology center for comprehensive hearing assessments and hearing aid fittings.`,highlights:["Hearing loss evaluation & hearing aids","Sinusitis & nasal allergy treatment","Tonsil & adenoid surgery","Thyroid & parathyroid surgery","Voice & swallowing disorder management","Pediatric ENT care"],detailImages:["https://images.pexels.com/photos/5206946/pexels-photo-5206946.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800","https://images.pexels.com/photos/7659869/pexels-photo-7659869.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800"],gradient:"from-indigo-500 to-indigo-700",image:"https://images.pexels.com/photos/5206946/pexels-photo-5206946.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=400&w=600"},{icon:i.jsx(A2,{}),title:"Radiology",slug:"radiology",desc:"Advanced imaging services including MRI, CT, and X-Ray.",longDesc:`The Radiology department at DEETYA Clinic is equipped with state-of-the-art imaging technology to provide accurate diagnostic services across all medical specialties. Our team of experienced radiologists and technicians ensure high-quality imaging with minimal waiting times.

We offer a comprehensive range of imaging services including digital X-rays, ultrasound, CT scans, MRI, mammography, and DEXA scans for bone density assessment. All our imaging equipment is regularly maintained and calibrated to the highest standards. Our digital imaging system allows for quick report generation and seamless sharing with referring physicians. We prioritize patient safety with strict radiation dose optimization protocols, especially for pediatric and pregnant patients. Our comfortable and spacious facility ensures a stress-free experience for all patients.`,highlights:["Digital X-ray & ultrasound","CT scan (computed tomography)","MRI (magnetic resonance imaging)","Mammography & breast imaging","DEXA bone density scan","Same-day digital reports"],detailImages:["https://images.pexels.com/photos/7089298/pexels-photo-7089298.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800","https://images.pexels.com/photos/7659869/pexels-photo-7659869.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=500&w=800"],gradient:"from-amber-500 to-amber-700",image:"https://images.pexels.com/photos/7089298/pexels-photo-7089298.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=400&w=600"},{icon:i.jsx(V2,{}),title:"Pharmacy",slug:"pharmacy",desc:"In-house pharmacy with genuine medicines at fair prices.",longDesc:`Our in-house Pharmacy at DEETYA Clinic ensures that patients have convenient access to genuine, high-quality medications at fair and transparent prices. Staffed by qualified pharmacists, our pharmacy is open round-the-clock to serve both inpatients and outpatients.
